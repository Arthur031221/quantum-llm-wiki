<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量子計算 LLM Wiki</title>
<meta name="description" content="由 LLM 維護的量子計算入門知識庫，每頁都整理自維基百科來源。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="assets/site.css">
<script src="assets/viewer.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">量子計算 LLM Wiki</a>
    <nav>
      <a href="slides.html">教學簡報</a>
      <a href="wiki.html" class="active">Wiki</a>
      <a href="workflow.html">流程與反思</a>
    </nav>
  </div>
</header>

<main class="container layout">
  <aside class="sidebar">
    <div id="toc"></div>
    <div class="extra">
      <ul>
        <li><a href="#log">wiki/log.md（時間紀錄）</a></li>
        <li><a href="https://github.com/Arthur031221/quantum-llm-wiki/tree/main/discussions" target="_blank">討論紀錄</a></li>
        <li><a href="https://github.com/Arthur031221/quantum-llm-wiki/tree/main/raw" target="_blank">原始來源 raw/</a></li>
      </ul>
    </div>
  </aside>
  <article class="doc" id="doc"></article>
</main>

<footer class="site-footer">內容整理自英文維基百科（CC BY-SA 4.0）・依 CLAUDE.md 規則由 LLM 維護</footer>

<script>
(async function () {
  const [indexMd, manifest, slideMap] = await Promise.all([
    fetch("wiki/index.md").then((r) => r.text()),
    fetch("raw/manifest.json").then((r) => r.json()),
    fetch("slides/slide-map.json").then((r) => r.json()).catch(() => ({})),
  ]);

  const toc = document.getElementById("toc");
  toc.innerHTML = renderMarkdown(indexMd);
  fixLinks(toc, "wiki/");

  async function show() {
    const slug = location.hash.slice(1) || "quantum-computer";
    const doc = document.getElementById("doc");
    const res = await fetch(`wiki/${slug}.md`);
    if (!res.ok) { doc.innerHTML = `<h1>找不到頁面</h1><p>wiki/${slug}.md 不存在。</p>`; return; }
    const { meta, body } = splitFrontmatter(await res.text());

    let box = "";
    if (meta.sources) {
      const srcs = [].concat(meta.sources).map((id) => {
        const m = manifest[id] || {};
        return `<li><a href="${m.url || "#"}" target="_blank">${m.title || id}</a>（維基百科）・<a href="${REPO}raw/${id}.md" target="_blank">raw 檔</a>・<a href="${REPO}discussions/${id}.md" target="_blank">討論紀錄</a></li>`;
      }).join("");
      const used = (slideMap[slug] || []).map((s) =>
        `<li><a href="slides.html#${s.n}">第 ${s.n} 張：${s.title}</a></li>`).join("");
      box = `<div class="meta-box"><h4>這頁的來源</h4><ul>${srcs}</ul>` +
        `<h4>用到這頁的投影片</h4><ul>${used || "<li>（目前沒有）</li>"}</ul></div>`;
    }
    const summary = meta.summary ? `<p class="summary">${meta.summary}</p>` : "";
    const html = renderMarkdown(body);
    const firstH1End = html.indexOf("</h1>");
    doc.innerHTML = firstH1End > 0
      ? html.slice(0, firstH1End + 5) + summary + box + html.slice(firstH1End + 5)
      : summary + box + html;
    fixLinks(doc, "wiki/");
    renderMath(doc);
    toc.querySelectorAll("a").forEach((a) => a.classList.toggle("active", a.getAttribute("href") === `wiki.html#${slug}`));
    document.title = `${meta.title || slug}｜量子計算 LLM Wiki`;
    window.scrollTo(0, 0);
  }
  toc.addEventListener("click", (e) => {
    const a = e.target.closest("a");
    if (a && a.getAttribute("href").startsWith("wiki.html#")) { e.preventDefault(); location.hash = a.getAttribute("href").split("#")[1]; }
  });
  window.addEventListener("hashchange", show);
  renderMath(toc);
  show();
})();
</script>
</body>
</html>
