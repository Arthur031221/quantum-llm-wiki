<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<meta name="description" content="從維基百科到教學簡報的loop和graph設計、實際執行紀錄與反思。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<link rel="stylesheet" href="assets/site.css">
<script src="assets/viewer.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">量子計算LLM Wiki</a>
    <nav>
      <a href="slides.html">教學簡報</a>
      <a href="wiki.html">Wiki</a>
      <a href="workflow.html" class="active">流程與反思</a>
    </nav>
  </div>
</header>
<main class="container" style="padding-top:24px">
  <article class="doc" id="doc"></article>
</main>
<footer class="site-footer">本頁內容來自repo裡的WORKFLOW.md</footer>
<script>
(async function () {
  const doc = document.getElementById("doc");
  const md = await fetch("WORKFLOW.md").then((r) => r.text());
  doc.innerHTML = renderMarkdown(md);
  doc.querySelectorAll("pre > code.language-mermaid").forEach((code) => {
    const pre = document.createElement("pre");
    pre.className = "mermaid";
    pre.textContent = code.textContent;
    code.parentElement.replaceWith(pre);
  });
  fixLinks(doc, "");
  renderMath(doc);
  mermaid.initialize({ startOnLoad: false, theme: "neutral", flowchart: { htmlLabels: true } });
  await mermaid.run({ querySelector: ".mermaid" });
})();
</script>
</body>
</html>
